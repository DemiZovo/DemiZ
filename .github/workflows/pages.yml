name: Check and deploy GitHub Pages
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: pages-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use locked pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
          run_install: false
      - name: Use locked Node.js LTS
        uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Resolve GitHub Pages URL
        shell: bash
        env:
          UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
          UMAMI_SCRIPT_URL: ${{ vars.UMAMI_SCRIPT_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          WRITER_URL: ${{ vars.WRITER_URL }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          echo "SITE_URL=https://${owner}.github.io" >> "$GITHUB_ENV"
          if [[ "${repo,,}" == "${owner}.github.io" ]]; then
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/${repo}" >> "$GITHUB_ENV"
          fi
          echo "PUBLIC_DEPLOY_ENV=production" >> "$GITHUB_ENV"
          if [[ -n "$UMAMI_WEBSITE_ID" ]]; then
            echo "PUBLIC_ANALYTICS_ENABLED=true" >> "$GITHUB_ENV"
            echo "PUBLIC_ANALYTICS_SITE_ID=$UMAMI_WEBSITE_ID" >> "$GITHUB_ENV"
            echo "PUBLIC_ANALYTICS_SCRIPT_URL=${UMAMI_SCRIPT_URL:-https://cloud.umami.is/script.js}" >> "$GITHUB_ENV"
          else
            echo "PUBLIC_ANALYTICS_ENABLED=false" >> "$GITHUB_ENV"
          fi
          if [[ -n "$SUPABASE_URL" && -n "$SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo "PUBLIC_SUPABASE_URL=$SUPABASE_URL" >> "$GITHUB_ENV"
            echo "PUBLIC_SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY" >> "$GITHUB_ENV"
          fi
          if [[ -n "$WRITER_URL" ]]; then
            echo "PUBLIC_WRITER_URL=$WRITER_URL" >> "$GITHUB_ENV"
          fi
      - name: Type and content checks
        run: pnpm run check:content
      - name: Production build
        run: pnpm run build
      - name: Isolate private writer from Pages artifact
        run: pnpm run prepare:writer
      - name: Verify generated URLs
        run: pnpm run verify:build
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
